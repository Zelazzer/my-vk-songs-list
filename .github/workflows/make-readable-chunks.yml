name: Make readable music chunks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert JSON chunks to NDJSON
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          src = Path('library_chunks')
          dst = Path('library_lines')
          dst.mkdir(exist_ok=True)

          for p in sorted(src.glob('songs_part_*.json')):
              with p.open('r', encoding='utf-8') as f:
                  songs = json.load(f)

              out = dst / p.name.replace('.json', '.ndjson')
              with out.open('w', encoding='utf-8') as f:
                  for song in songs:
                      f.write(json.dumps(song, ensure_ascii=False, separators=(',', ':')) + '\n')

              print(f'{p.name}: {len(songs)} songs -> {out}')
          PY

      - name: Commit readable chunks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add library_lines/
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add readable newline-separated music chunks'
            git push
          fi
